name: Release

# Push a tag equal to the manifest version (e.g. 0.1.0, no "v") to publish a release
# with main.js + manifest.json attached. BRAT and manual installs use those assets.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json \
            --title "${GITHUB_REF_NAME}" --notes "Diesel Sync ${GITHUB_REF_NAME}"
